# TEMPORARY diagnostic for the live-Chrome "CDP response pipe closed" failure. Removed before review.
name: chrome-diag
on:
  push:
    branches: [claude/project-thread-07tqdk]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test -p sovereign-tools -p sovereign --no-run
      - name: Runner browser test first on a fresh runner (x3)
        run: |
          echo "X dir before: $(getconf DARWIN_USER_TEMP_DIR)/../X"; ls -la "$(getconf DARWIN_USER_TEMP_DIR)/../X" || true
          for i in 1 2 3; do echo "=== runner browser run $i"; cargo test -p sovereign --bin sovereign browser_goal_run_once -- --nocapture 2>&1 | grep -v -e cv_display_link -e backupd.sandbox; done
          echo "X dir after:"; ls -la "$(getconf DARWIN_USER_TEMP_DIR)/../X" || true
        continue-on-error: true
