# TEMPORARY diagnostic for the live-Chrome "CDP response pipe closed" failure. Removed before review.
name: chrome-diag
on:
  push:
    branches: [claude/project-thread-07tqdk]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: cargo test -p sovereign-tools -p sovereign --no-run
      - name: Browser tests in parallel x3
        run: for i in 1 2 3; do echo "=== browser parallel run $i"; cargo test -p sovereign-tools --test browser 2>&1 | grep -v -e cv_display_link -e backupd.sandbox; done
        continue-on-error: true
      - name: Full sovereign bin tests x2
        run: for i in 1 2; do echo "=== sovereign bin run $i"; cargo test -p sovereign --bin sovereign 2>&1 | grep -v -e cv_display_link -e backupd.sandbox -e ' ... ok$'; done
        continue-on-error: true
