[workspace]
resolver = "2"
members = [
    "apps/sovereign",
    "crates/sovereign-context",
    "crates/sovereign-controller",
    "crates/sovereign-eval",
    "crates/sovereign-evidence",
    "crates/sovereign-model",
    "crates/sovereign-plan",
    "crates/sovereign-policy",
    "crates/sovereign-repo",
    "crates/sovereign-state",
    "crates/sovereign-tools",
    "crates/sovereign-types",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "UNLICENSED"
authors = ["Sovereign contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
jsonschema = { version = "0.56.0", default-features = false }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
